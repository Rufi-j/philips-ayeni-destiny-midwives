<title>Thank you · The Mystery of the Destiny Midwives</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">

<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">

<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--purple-deep:#1A0B33;--saffron:#F2A93B;--lav:#F5F0FB}
*{box-sizing:border-box;margin:0}
body{font-family:Archivo,system-ui,sans-serif;background:var(--purple-deep);color:#E4D8F5;min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;-webkit-font-smoothing:antialiased}
main{max-width:560px}
.eyebrow{font-weight:700;letter-spacing:.28em;text-transform:uppercase;font-size:.78rem;color:var(--saffron)}
h1{font-family:Anton,Impact,sans-serif;text-transform:uppercase;font-weight:400;font-size:clamp(2.8rem,9vw,4.6rem);line-height:.95;color:var(--lav);margin:16px 0 20px}
h1 span{color:var(--saffron)}
p{font-size:1.15rem;margin-bottom:12px}
a.btn{display:inline-block;margin-top:22px;padding:16px 26px;background:var(--saffron);color:var(--purple-deep);font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;font-size:.92rem}
</style>
</head>
<body>
<main>
  <p class="eyebrow">Order received</p>
  <h1>Thank <span>you.</span></h1>
  <p>Your details have been received. We will reach out on WhatsApp or email to confirm your order.</p>
  <a class="btn" href="/">Back to the book</a>
</main>
</body>
