<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order the paperback · The Mystery of the Destiny Midwives</title>
<meta name="description" content="Order your paperback copy of The Mystery of the Destiny Midwives by Philips Ayeni.">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#2B1452">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--purple:#2B1452;--purple-deep:#1A0B33;--saffron:#F2A93B;--gold-text:#8A5A10;--ink:#171A2E;--lav:#F5F0FB}
*{box-sizing:border-box;margin:0}
body{font-family:Archivo,system-ui,sans-serif;color:var(--ink);background:var(--purple-deep);line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
img{max-width:100%;display:block}
.display{font-family:Anton,Impact,sans-serif;text-transform:uppercase;line-height:.95;font-weight:400}
.eyebrow{font-weight:700;letter-spacing:.28em;text-transform:uppercase;font-size:.78rem;color:var(--saffron)}
.top{padding:20px;max-width:1100px;margin:0 auto}
.top a{color:var(--lav);text-decoration:none;font-weight:700;font-size:.9rem;letter-spacing:.04em}
.top a:hover{color:var(--saffron)}
.wrap{max-width:1100px;margin:0 auto;padding:20px 20px 80px;display:grid;grid-template-columns:.85fr 1.15fr;gap:56px;align-items:center}
.intro h1{font-size:clamp(2.6rem,6vw,4.4rem);color:var(--lav);margin:14px 0 18px}
.intro h1 span{color:var(--saffron);display:block}

.intro p{color:#E4D8F5;font-size:1.1rem;max-width:34ch}
.intro p.eyebrow{color:var(--saffron);max-width:none;font-size:.78rem}
.price{margin-top:22px;display:inline-block;border:2px solid var(--saffron);color:var(--saffron);padding:8px 16px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.85rem}
.card{background:#fff;padding:36px;border-top:6px solid var(--saffron)}
.card h2{font-family:Anton,sans-serif;text-transform:uppercase;font-weight:400;font-size:1.9rem;margin-bottom:6px}
.card .lead{color:#454763;margin-bottom:24px;font-size:.98rem}
.field{margin-bottom:18px}
label{display:block;font-weight:700;font-size:.86rem;letter-spacing:.04em;margin-bottom:6px}
label small{font-weight:400;color:#6b6d85}
input,textarea{width:100%;font:inherit;padding:13px 14px;border:2px solid #cfcbdc;border-radius:0;background:#fff;color:var(--ink)}
textarea{min-height:96px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 3px rgba(43,20,82,.15)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.hp{position:absolute;left:-9999px;height:0;overflow:hidden}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:.88rem;color:#454763;margin:6px 0 22px}
.consent input{width:auto;margin-top:4px;accent-color:var(--purple)}
button{width:100%;background:var(--saffron);color:var(--purple-deep);border:2px solid var(--saffron);padding:17px;font:inherit;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;font-size:.95rem}
button:hover{background:#ffbd55}
.note{margin-top:14px;font-size:.85rem;color:#6b6d85;text-align:center}
.note a{color:var(--gold-text);font-weight:700}
@media(max-width:860px){.wrap{grid-template-columns:1fr;gap:36px}.intro{text-align:center}.intro p{margin:0 auto}.book{width:min(70%,260px)}.row{grid-template-columns:1fr}.card{padding:26px 20px}}
/* 3D book mockup */
.book{--w:100%;--t:30px;position:relative;width:min(100%,340px);margin:0 auto;perspective:1600px;padding:24px 0 36px}
.book .box{position:relative;transform-style:preserve-3d;transform:rotateY(-26deg) rotateX(3deg) rotateZ(.4deg);transition:transform .5s ease}
.book:hover .box{transform:rotateY(-12deg) rotateX(2deg)}
.book .front{display:block;width:100%;height:auto;aspect-ratio:2/3;transform:translateZ(calc(var(--t)/2));border-radius:2px 5px 5px 2px;position:relative}
.book .front-wrap{position:relative;transform-style:preserve-3d}
.book .gloss{position:absolute;inset:0;transform:translateZ(calc(var(--t)/2 + .5px));border-radius:2px 5px 5px 2px;pointer-events:none;
  background:
    linear-gradient(90deg,rgba(0,0,0,.38) 0,rgba(0,0,0,.05) 1.6%,rgba(255,255,255,.22) 2.6%,rgba(0,0,0,.14) 4.4%,transparent 7%),
    linear-gradient(115deg,rgba(255,255,255,.2) 0,transparent 38%,transparent 70%,rgba(0,0,0,.18) 100%)}
.book .pages{position:absolute;top:1.2%;bottom:1.2%;right:0;width:var(--t);transform:translateX(50%) rotateY(90deg);
  background:repeating-linear-gradient(90deg,#f4efe6 0 2px,#d9d2c3 2px 3px);box-shadow:inset 0 0 8px rgba(0,0,0,.25)}
.book .spine{position:absolute;top:0;bottom:0;left:0;width:var(--t);transform:translateX(-50%) rotateY(-90deg);background:linear-gradient(90deg,#150a2b,#2B1452)}
.book .back{position:absolute;inset:0;transform:translateZ(calc(var(--t)/-2));background:#1a0b33;border-radius:5px 2px 2px 5px}
.book .shadow{position:absolute;left:8%;right:-6%;bottom:6px;height:26px;background:radial-gradient(ellipse at center,rgba(0,0,0,.5),transparent 70%);filter:blur(8px);transform:translateZ(-1px)}
</style>
</head>
<body>
<div class="top"><a href="/">← Back to the book</a></div>
<main class="wrap">
  <section class="intro">
    <div class="book" role="img" aria-label="The Mystery of the Destiny Midwives, paperback">
      <div class="box"><div class="front-wrap"><img class="front" src="img/cover.png" alt=""><span class="gloss"></span></div><span class="pages"></span><span class="spine"></span><span class="back"></span></div>
      <span class="shadow"></span>
    </div>
    <p class="eyebrow" style="margin-top:28px">Paperback · Launching 5 December 2026</p>
    <h1 class="display">Order your <span>copy.</span></h1>
    <p>Tell us where to send it. We will be in touch to confirm your order.</p>
    <span class="price">US $10 per copy</span>
  </section>

  <section class="card">
    <h2>Your details</h2>
    <p class="lead">Five quick fields. That is all we need.</p>
    <form name="paperback-order" method="POST" action="/thank-you" data-netlify="true" netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="paperback-order">
      <p class="hp"><label>Leave this empty: <input name="bot-field" tabindex="-1" autocomplete="off"></label></p>

      <div class="field">
        <label for="name">Full name</label>
        <input id="name" name="name" type="text" autocomplete="name" required>
      </div>
      <div class="row">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="whatsapp">WhatsApp number <small>(with country code)</small></label>
          <input id="whatsapp" name="whatsapp" type="tel" inputmode="tel" autocomplete="tel" placeholder="+234 801 234 5678" required>
        </div>
      </div>
      <div class="field">
        <label for="address">Delivery address</label>
        <textarea id="address" name="address" autocomplete="street-address" placeholder="Street, city, state, country" required></textarea>
      </div>
      <div class="field">
        <label for="copies">Number of copies</label>
        <input id="copies" name="copies" type="number" min="1" max="500" value="1" inputmode="numeric" required>
      </div>
      <label class="consent"><input type="checkbox" name="consent" value="yes" required> I agree that my details may be used to process and deliver my order.</label>
      <button type="submit">Place my order</button>
      <p id="form-msg" class="note" role="alert" style="color:#a3262a"></p>
      <p class="note">Prefer email? <a href="mailto:thephilipsayeni@gmail.com?subject=Paperback%20order">thephilipsayeni@gmail.com</a></p>
    </form>
  </section>
</main>
<script>
// Paste the Google Apps Script web-app URL (ends in /exec) between the quotes to send orders to the Google Sheet.
// While it is empty, the form falls back to Netlify Forms so no order is lost.
var ORDER_ENDPOINT = '';
(function(){
  var form=document.querySelector('form[name="paperback-order"]');
  if(!form||!ORDER_ENDPOINT) return;
  var btn=form.querySelector('button[type="submit"]'), msg=document.getElementById('form-msg');
  form.addEventListener('submit',function(e){
    e.preventDefault();
    if(!form.reportValidity()) return;
    var label=btn.textContent; btn.disabled=true; btn.textContent='Sending…'; msg.textContent='';
    var data=new URLSearchParams(new FormData(form));
    fetch(ORDER_ENDPOINT,{method:'POST',mode:'no-cors',body:data})
      .then(function(){ window.location.href='/thank-you'; })
      .catch(function(){
        btn.disabled=false; btn.textContent=label;
        msg.innerHTML='Sorry, that did not go through. Please try again, or email <a href="mailto:thephilipsayeni@gmail.com?subject=Paperback%20order">thephilipsayeni@gmail.com</a>.';
      });
  });
})();
</script>
</body>
</html>
